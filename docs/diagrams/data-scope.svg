<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-label="数据范围规则（同一接口，不同角色看到不同数据）">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#10b981"/></linearGradient>
</defs>
<rect x="0" y="0" width="1180" height="470" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1180" height="46" rx="0" fill="url(#g1)" stroke="none" stroke-width="1"/>
<text x="20" y="30" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start" >数据范围规则（同一接口，不同角色看到不同数据）</text>

<rect x="30" y="62" width="350" height="300" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<rect x="30" y="62" width="350" height="52" rx="10" fill="#0f766e" stroke="none" stroke-width="1"/>
<rect x="30" y="100" width="350" height="14" rx="0" fill="#0f766e" stroke="none" stroke-width="1"/>
<text x="48" y="86" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="start" >全局范围 ORG</text>
<text x="48" y="104" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="start" >ADMIN 管理员 / FINANCE 财务 / 服务账号</text>
<text x="50" y="146" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" >· 全部工厂的客户、订单与财务数据</text>
<text x="50" y="172" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" >· 信用看板覆盖所有客户</text>
<text x="50" y="198" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" >· 经营指标为全公司汇总</text>
<rect x="44" y="232" width="322" height="46" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="56" y="252" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#0f766e" text-anchor="start" >规则要点</text>
<text x="56" y="268" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >财务账号不绑定工厂，天然是全局范围</text>
<rect x="415" y="62" width="350" height="300" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<rect x="415" y="62" width="350" height="52" rx="10" fill="#d97706" stroke="none" stroke-width="1"/>
<rect x="415" y="100" width="350" height="14" rx="0" fill="#d97706" stroke="none" stroke-width="1"/>
<text x="433" y="86" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="start" >工厂范围 FACTORY</text>
<text x="433" y="104" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="start" >FACTORY_MANAGER 厂长</text>
<text x="435" y="146" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" >· 仅本工厂的设备、工单与队列</text>
<text x="435" y="172" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" >· 本工厂的仓储与出入库</text>
<text x="435" y="198" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" >· 本工厂资产类事实指标</text>
<rect x="429" y="232" width="322" height="46" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="441" y="252" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#d97706" text-anchor="start" >规则要点</text>
<text x="441" y="268" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >由用户所属工厂过滤，非角色硬编码</text>
<rect x="800" y="62" width="350" height="300" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<rect x="800" y="62" width="350" height="52" rx="10" fill="#2563eb" stroke="none" stroke-width="1"/>
<rect x="800" y="100" width="350" height="14" rx="0" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="818" y="86" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="start" >本人范围 OWN</text>
<text x="818" y="104" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="400" fill="#e2e8f0" text-anchor="start" >SALES 销售 / OPERATOR 操作员</text>
<text x="820" y="146" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" >· 仅归属自己的客户档案</text>
<text x="820" y="172" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" >· 仅自己创建的订单</text>
<text x="820" y="198" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" >· 排产队列只看自己工单对应记录</text>
<rect x="814" y="232" width="322" height="46" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="826" y="252" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-anchor="start" >规则要点</text>
<text x="826" y="268" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >销售建客户时归属与额度由后端收紧为本人/0</text>
<rect x="30" y="384" width="1120" height="66" rx="8" fill="#eef6f4" stroke="#10b981" stroke-width="1"/>
<text x="48" y="408" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start" >为什么销售能看到「工作台」却看不到「经营大屏」？</text>
<text x="48" y="430" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" >两者是两条独立权限：bi:dashboard:read（工作台经营指标区）与 bi:cockpit:read（16:9 经营大屏）。销售只被授予前者，</text>
<text x="48" y="444" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start" >直接访问 /cockpit 会被路由守卫拦到「无访问权限」页，并明确提示缺失权限码 bi:cockpit:read。</text>
</svg>
