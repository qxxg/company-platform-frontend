<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-label="统一认证登录与鉴权流程（OAuth2 授权码 + PKCE）">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#10b981"/></linearGradient>
</defs>
<rect x="0" y="0" width="1180" height="520" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1180" height="46" rx="0" fill="url(#g1)" stroke="none" stroke-width="1"/>
<text x="20" y="30" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start" >统一认证登录与鉴权流程（OAuth2 授权码 + PKCE）</text>

<rect x="24" y="70" width="200" height="92" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<rect x="24" y="70" width="200" height="24" rx="8" fill="#0f766e" stroke="none" stroke-width="1"/>
<rect x="24" y="86" width="200" height="8" rx="0" fill="#0f766e" stroke="none" stroke-width="1"/>
<text x="124" y="87" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle" >STEP 1</text>
<text x="36" y="118" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start" >打开登录页</text>
<text x="36" y="136" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >PC Web 生成 code_verifier</text>
<text x="36" y="150" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >并计算 code_challenge</text>
<rect x="256" y="70" width="200" height="92" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<rect x="256" y="70" width="200" height="24" rx="8" fill="#0f766e" stroke="none" stroke-width="1"/>
<rect x="256" y="86" width="200" height="8" rx="0" fill="#0f766e" stroke="none" stroke-width="1"/>
<text x="356" y="87" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle" >STEP 2</text>
<text x="268" y="118" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start" >跳转认证中心</text>
<text x="268" y="136" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >携带 client_id=pc-web</text>
<text x="268" y="150" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >与 challenge 方法 S256</text>
<rect x="488" y="70" width="200" height="92" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<rect x="488" y="70" width="200" height="24" rx="8" fill="#0f766e" stroke="none" stroke-width="1"/>
<rect x="488" y="86" width="200" height="8" rx="0" fill="#0f766e" stroke="none" stroke-width="1"/>
<text x="588" y="87" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle" >STEP 3</text>
<text x="500" y="118" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start" >输入账号密码</text>
<text x="500" y="136" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >密码只提交给认证中心</text>
<text x="500" y="150" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >业务页面不接触口令</text>
<rect x="720" y="70" width="200" height="92" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<rect x="720" y="70" width="200" height="24" rx="8" fill="#0f766e" stroke="none" stroke-width="1"/>
<rect x="720" y="86" width="200" height="8" rx="0" fill="#0f766e" stroke="none" stroke-width="1"/>
<text x="820" y="87" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle" >STEP 4</text>
<text x="732" y="118" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start" >换取令牌</text>
<text x="732" y="136" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >POST /oauth2/token</text>
<text x="732" y="150" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >校验 code + verifier</text>
<rect x="952" y="70" width="200" height="92" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<rect x="952" y="70" width="200" height="24" rx="8" fill="#0f766e" stroke="none" stroke-width="1"/>
<rect x="952" y="86" width="200" height="8" rx="0" fill="#0f766e" stroke="none" stroke-width="1"/>
<text x="1052" y="87" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle" >STEP 5</text>
<text x="964" y="118" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start" >写入会话</text>
<text x="964" y="136" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >access_token 存 localStorage</text>
<text x="964" y="150" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start" >权限数组随 JWT 下发</text>
<line x1="224" y1="116" x2="250" y2="116" stroke="#94a3b8" stroke-width="1.5"  marker-end="url(#arT)"/>
<line x1="456" y1="116" x2="482" y2="116" stroke="#94a3b8" stroke-width="1.5"  marker-end="url(#arT)"/>
<line x1="688" y1="116" x2="714" y2="116" stroke="#94a3b8" stroke-width="1.5"  marker-end="url(#arT)"/>
<line x1="920" y1="116" x2="946" y2="116" stroke="#94a3b8" stroke-width="1.5"  marker-end="url(#arT)"/>
<rect x="24" y="186" width="560" height="300" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="44" y="214" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start" >令牌里带了什么</text>
<rect x="44" y="226" width="220" height="30" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="54" y="246" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#0f766e" text-anchor="start" >sub</text>
<text x="280" y="246" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start" >用户 ID（雪花号）</text>
<rect x="44" y="272" width="220" height="30" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="54" y="292" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#0f766e" text-anchor="start" >authorities / permissions</text>
<text x="280" y="292" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start" >权限码数组，如 bi:cockpit:read</text>
<rect x="44" y="318" width="220" height="30" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="54" y="338" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#0f766e" text-anchor="start" >roles</text>
<text x="280" y="338" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start" >角色编码：ADMIN / SALES / FINANCE …</text>
<rect x="44" y="364" width="220" height="30" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="54" y="384" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#0f766e" text-anchor="start" >factoryId</text>
<text x="280" y="384" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start" >所属工厂（财务为空，表示全局）</text>
<rect x="44" y="410" width="220" height="30" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="54" y="430" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#0f766e" text-anchor="start" >iss / exp / jti</text>
<text x="280" y="430" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start" >签发方、过期时间、令牌唯一标识</text>
<rect x="604" y="186" width="552" height="300" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="624" y="214" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start" >访问一次接口会发生什么</text>
<rect x="624" y="226" width="28" height="28" rx="14" fill="#0f766e" stroke="none" stroke-width="1"/>
<text x="638" y="246" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<text x="666" y="246" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start" >浏览器携带 Authorization: Bearer &lt;access_token&gt; 请求网关 /api/**</text>
<rect x="624" y="270" width="28" height="28" rx="14" fill="#0f766e" stroke="none" stroke-width="1"/>
<text x="638" y="290" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<text x="666" y="290" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start" >网关用认证中心 JWK 校验签名与有效期，失败直接返回 401</text>
<rect x="624" y="314" width="28" height="28" rx="14" fill="#0f766e" stroke="none" stroke-width="1"/>
<text x="638" y="334" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<text x="666" y="334" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start" >网关按 Nacos 实例路由到业务服务，并透传用户令牌</text>
<rect x="624" y="358" width="28" height="28" rx="14" fill="#0f766e" stroke="none" stroke-width="1"/>
<text x="638" y="378" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<text x="666" y="378" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start" >业务服务用 @PreAuthorize 校验具体权限码，失败返回 403</text>
<rect x="624" y="402" width="28" height="28" rx="14" fill="#0f766e" stroke="none" stroke-width="1"/>
<text x="638" y="422" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >5</text>
<text x="666" y="422" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start" >业务服务再按用户角色追加数据范围过滤后查询数据库</text>
<text x="624" y="470" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="11.5" font-weight="400" fill="#dc2626" text-anchor="start" >注意：权限调整后必须重新登录，旧 JWT 里的权限声明不会自动刷新。</text>
</svg>
