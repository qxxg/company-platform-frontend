<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="公司管理系统 PC Web 端" />
    <title>公司管理系统</title>
    <style>
      /* Vue 挂载前的首屏占位，避免白屏。 */
      html, body, #app { height: 100%; margin: 0; }
      body { background: #f3f6f8; }
      .boot-screen {
        display: flex; height: 100%; align-items: center; justify-content: center;
        flex-direction: column; gap: 18px; color: #475569;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }
      .boot-mark {
        width: 52px; height: 52px; border-radius: 16px;
        background: linear-gradient(135deg, #0f766e, #34d399);
        box-shadow: 0 12px 30px rgba(15, 118, 110, .28);
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(.92); opacity: .72; }
        50% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen">
        <div class="boot-mark"></div>
        <div>正在加载公司管理系统…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
